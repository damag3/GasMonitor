<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gas Monitor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: #0f172a;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .card {
      background: #111827;
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #9ca3af;
      margin-bottom: 6px;
    }
    .value {
      font-size: 26px;
      font-weight: 600;
    }
    .sub {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }
    .status-ok {
      color: #22c55e;
    }
    .status-alarm {
      color: #f97316;
    }
    button {
      background: #ef4444;
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(239,68,68,0.4);
    }
    button:active {
      transform: translateY(1px);
      box-shadow: 0 4px 10px rgba(239,68,68,0.4);
    }
    canvas {
      background: #020617;
      border-radius: 12px;
      padding: 8px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Gas Monitor</h1>

  <div class="grid">
    <div class="card">
      <div class="label">MQ2</div>
      <div class="value" id="mq2">--</div>
      <div class="sub">Escala 0–1023</div>
    </div>

    <div class="card">
      <div class="label">TGS</div>
      <div class="value" id="tgs">--</div>
      <div class="sub">Escala 0–1023</div>
    </div>

    <div class="card">
      <div class="label">Estado</div>
      <div class="value" id="estado">--</div>
      <div class="sub" id="baseline">Baseline: --</div>
    </div>

    <div class="card">
      <div class="label">Sensor</div>
      <div class="value" id="sensor">--</div>
      <div class="sub">
        <button onclick="desligar()">DESLIGAR BUZZER</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="label">Alarmes Individuais</div>
    <div class="value" id="mq2_alarm">--</div>
    <div class="value" id="tgs_alarm">--</div>
  </div>

  <div class="card">
    <div class="label">Histórico MQ2</div>
    <canvas id="chart" height="120"></canvas>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const mq2El = document.getElementById('mq2');
  const tgsEl = document.getElementById('tgs');
  const estadoEl = document.getElementById('estado');
  const sensorEl = document.getElementById('sensor');
  const baselineEl = document.getElementById('baseline');
  const mq2AlarmEl = document.getElementById('mq2_alarm');
  const tgsAlarmEl = document.getElementById('tgs_alarm');

  const ctx = document.getElementById('chart').getContext('2d');
  const chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: 'MQ2 (0–1023)',
        borderColor: 'rgb(239, 68, 68)',
        backgroundColor: 'rgba(239, 68, 68, 0.15)',
        data: [],
        tension: 0.25,
        pointRadius: 0
      }]
    },
    options: {
      animation: false,
      responsive: true,
      scales: {
        x: { display: false },
        y: {
          beginAtZero: true,
          suggestedMax: 1023,
          grid: { color: 'rgba(55,65,81,0.4)' },
          ticks: { color: '#9ca3af' }
        }
      },
      plugins: {
        legend: { labels: { color: '#e5e7eb' } }
      }
    }
  });

  function update() {
    fetch('/data')
      .then(r => r.json())
      .then(d => {
        mq2El.textContent = d.mq2;
        tgsEl.textContent = d.tgs;
        baselineEl.textContent = 'Baseline: ' + d.baseline;

        mq2AlarmEl.textContent = d.mq2_alarm ? 'MQ‑2 (Butano) ATIVO' : 'MQ‑2 OK';
        tgsAlarmEl.textContent = d.tgs_alarm ? 'TGS2610 (Metano) ATIVO' : 'TGS2610 OK';

        if (d.error) {
          sensorEl.textContent = 'ERRO';
          sensorEl.className = 'value status-alarm';
        } else {
          sensorEl.textContent = 'OK';
          sensorEl.className = 'value status-ok';
        }

        if (d.alarm) {
          estadoEl.textContent = 'ALERTA';
          estadoEl.className = 'value status-alarm';
        } else {
          estadoEl.textContent = 'OK';
          estadoEl.className = 'value status-ok';
        }

        chart.data.labels.push('');
        chart.data.datasets[0].data.push(d.mq2);
        if (chart.data.labels.length > 60) {
          chart.data.labels.shift();
          chart.data.datasets[0].data.shift();
        }
        chart.update();
      })
      .catch(() => {});
  }

  function desligar() {
    fetch('/off').catch(() => {});
  }

  setInterval(update, 500);
  update();
</script>
</body>
</html>
